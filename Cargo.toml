[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version    = "0.0.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/ShaxP/omaghy"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

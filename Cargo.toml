[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version    = "0.0.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/ShaxP/omaghy"

# Every M1 dependency is declared here, once, so that concurrent agents never
# conflict in the generated lockfile. See spec/90-plan.md §2.1.
#
# Two policies from PREREQUISITES.md §5 are load-bearing and encoded below:
# no OpenSSL (rustls, system roots), and bundled SQLite. Taking a crate default
# silently reverses either one.
[workspace.dependencies]
# internal — the graph points strictly downward from omaghy-model
omaghy-model = { path = "crates/omaghy-model" }
omaghy-store = { path = "crates/omaghy-store" }
omaghy-api   = { path = "crates/omaghy-api" }
omaghy-cache = { path = "crates/omaghy-cache" }
omaghy-sync  = { path = "crates/omaghy-sync" }
omaghy-tui   = { path = "crates/omaghy-tui" }

# core vocabulary
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
time        = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }

# async
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "signal"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# HTTP — rustls only. default-features = false keeps native-tls (and with it
# OpenSSL) out; native roots rather than a compiled-in bundle, so a corporate
# TLS-inspecting proxy does not look like a network bug.
# "rustls-no-provider" is deliberate: the plain "rustls" feature selects
# aws-lc-rs, which requires cmake. We pick the provider ourselves below.
reqwest     = { version = "0.13", default-features = false, features = ["rustls-no-provider", "rustls-native-certs", "gzip", "json", "http2"] }
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# storage — bundled compiles SQLite from source: the version is the one we
# tested, and the binary carries no runtime .so
rusqlite    = { version = "0.40", features = ["bundled", "time"] }

# terminal
ratatui     = "0.30"
crossterm   = { version = "0.29", features = ["event-stream"] }
tui-input   = "0.15"
# Cell width is display width, not char count: one CJK glyph occupies two
# cells and a combining mark none. Already in the tree via ratatui, so this
# adds no resolution.
unicode-width = "0.2"

# binary
clap        = { version = "4", features = ["derive", "env"] }
anyhow      = "1"
directories = "6"
toml        = "1"

# diagnostics — a TUI owns the screen, so logs go to a file
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev
insta       = { version = "1", features = ["yaml"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"
